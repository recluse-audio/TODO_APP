<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<body class="antialiased" style="background: var(--color-bg); color: var(--color-text);">

      <div id="conn-indicator" class="text-xs" style="color: var(--color-accent);">connecting…</div>
